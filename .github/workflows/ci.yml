name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.x"
          - "1.26.6"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true
      - name: Set up Python for TOML compatibility test
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Install govulncheck
        if: matrix.go-version == '1.26.6'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan for vulnerabilities
        if: matrix.go-version == '1.26.6'
        run: govulncheck ./...
